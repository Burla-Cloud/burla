[project]
name = "burla"
version = "1.6.3"
description = "Easy to use cluster-compute software."
requires-python = ">=3.11"
# Everything below `yaspin` exists so the cluster head (main_service, vendored
# into this wheel) can run inside the client: the default "client-hosted" mode.
dependencies = [
    "aiohttp>=3.13.2",
    "azure-identity>=1.19.0",
    "azure-mgmt-compute>=33.0.0",
    "azure-mgmt-network>=28.0.0",
    "azure-storage-blob>=12.24.0",
    "boto3>=1.42.39",
    "cloudpickle>=3.1.1",
    "fire>=0.7.1",
    "google-auth>=2.42.0",
    "platformdirs>=4.5.0",
    "requests==2.32.4",
    "tblib>=3.2.0",
    "yaspin>=3.3.0",
    "cryptography>=42.0.0",
    "fastapi>=0.109.0",
    "google-cloud-compute>=1.14.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "uvicorn>=0.25.0",
]

[project.scripts]
burla = "burla.__init__:init_cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burla"]

# Client-hosted mode runs the cluster head from inside this package, so the
# wheel ships main_service (dashboard static files included) alongside burla.
# The hook supports both direct wheel builds and wheels built from the sdist.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"hatch_build.py" = "hatch_build.py"

[dependency-groups]
dev = [
    "anyscale>=0.26.82",
    "daft>=0.6.13",
    "delta-spark>=4.0.0",
    "diceware>=1.0.1",
    # `make local-dev` runs main_service in this venv and it boots node
    # containers via the docker SDK; watchfiles gives uvicorn --reload proper
    # include/exclude handling instead of falling back to stat-polling.
    "docker>=7.1.0",
    "duckdb>=1.4.1",
    "fastparquet>=2024.11.0",
    "freezegun>=1.5.1",
    "geopandas[all]>=1.1.3",
    "google-cloud-storage>=3.5.0",
    "httpx>=0.27.0",
    "ipykernel>=7.1.0",
    "jupyterlab>=4.4.10",
    "kagglehub>=0.3.13",
    "mapclassify[spatial]>=2.8.1",
    "matplotlib>=3.10.7",
    "nltk>=3.9.3",
    "pandas>=2.3.3",
    # Dashboard-UI tier (tests/dashboard/); browsers install via
    # `playwright install chromium`, which `make test-dashboard` runs.
    "playwright>=1.49.0",
    "psutil>=6.0.0",
    "pyarrow>=22.0.0",
    "pyspark>=4.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    # Some of the heavier dev deps have no 3.14 wheels yet; skip them there so a
    # 3.14 shell still works for testing the client itself.
    "ray>=2.53.0; python_version < '3.14'",
    "scikit-learn>=1.7.2",
    "watchfiles>=1.0.4",
    "xgboost>=3.1.1",
]

# Pytest configuration lives in the repo-root pytest.ini so all three
# packages and the root tests/ dir share the same conftest, markers, and
# timeout. Running `pytest client/tests/...` from the repo root picks up
# the root config automatically.
