[project]
name = "main-service"
version = "1.6.6"
description = ""
authors = [
    { name = "Jacob Zuliani", email = "jake@burla.dev" },
    { name = "Joseph Perry", email = "joe@burla.dev" },
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiohttp>=3.11.18,<4.0.0",
    "azure-identity>=1.25.3,<2.0.0",
    "azure-mgmt-compute>=38.2.0,<39.0.0",
    "azure-mgmt-network>=31.0.1,<32.0.0",
    "azure-storage-blob>=12.30.0,<13.0.0",
    "boto3>=1.34.0,<2.0.0",
    "cloudpickle>=2.2.1,<3.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "docker>=7.1.0,<8.0.0",
    "fastapi>=0.109.0,<0.110.0",
    "google-auth>=2.22.0,<3.0.0",
    "google-cloud-compute>=1.14.1,<2.0.0",
    "google-cloud-resource-manager>=1.14.1,<2.0.0",
    "google-cloud-storage>=2.10.0,<3.0.0",
    "grpcio>=1.54.2,<2.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "packaging>=25.0,<26.0",
    "python-multipart>=0.0.9,<0.1.0",
    "pytz>=2024.1,<2025.0",
    "requests>=2.31.0,<3.0.0",
    "starlette>=0.35.1,<0.36.0",
    "tblib>=3.0.0,<4.0.0",
    "uvicorn>=0.25.0,<0.26.0",
    "watchfiles>=1.0.4,<2.0.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
]

# See repo-root pytest.ini for the shared pytest configuration.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main_service"]
