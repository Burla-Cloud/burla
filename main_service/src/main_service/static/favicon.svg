<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Integer 16-grid so the mark rasterizes crisply at 16/32/48px. -->
  <style>
    :root { --mark: #3B5A64; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #7ECBDD; }
    }
  </style>
  <g fill="var(--mark)">
    <rect x="1" y="3" width="3" height="3" />
    <rect x="4" y="6" width="3" height="3" />
    <rect x="1" y="9" width="3" height="3" />
    <rect x="10" y="9" width="6" height="3" />
  </g>
</svg>
