[project]
name = "node-service"
version = "1.7.5"
description = ""
authors = [{ name = "Jacob Zuliani", email = "jake@burla.dev" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "aiodocker>=0.26.0,<0.27.0",
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn>=0.34.3,<0.35.0",
    "python-multipart>=0.0.20,<0.0.21",
    "aiohttp>=3.12.11,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    # Only used to pull private images from Google Artifact Registry.
    "google-auth>=2.22.0,<3.0.0",
    "psutil>=7.1.0,<8.0.0",
    # Pure-python NVML binding; harmless on CPU-only nodes (init just fails).
    "nvidia-ml-py>=12.0.0",
    "packaging>=25.0,<26.0",
    "cloudpickle>=3.1.2,<4.0.0",
    "tblib>=3.2.2,<4.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_service"]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
]

# See repo-root pytest.ini for the shared pytest configuration.
