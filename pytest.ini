[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib --strict-markers
markers =
    service: service-level test, requires make local-dev
    e2e: full end-to-end test, requires make local-dev
    chaos: failure-injection test, requires make local-dev
    slow: slow test (>30s)
    dashboard: requires Playwright, browser, and dashboard UI
timeout = 120
# Test bodies only: the cluster readiness gate bounds itself (SETTLE/CLEAN
# timeouts) and must fail with its own clear error, not a mid-fixture SIGALRM
# that also kills teardown and leaks reserved nodes into the next test.
timeout_func_only = true
testpaths =
    client/tests
    main_service/tests
    node_service/tests
    tests
filterwarnings =
    ignore::DeprecationWarning
