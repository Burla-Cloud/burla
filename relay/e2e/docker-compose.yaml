services:
  frps:
    image: fatedier/frps:v0.70.1
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ../frps.toml:/etc/frp/frps.toml:ro
    environment:
      FRP_SUBDOMAIN_HOST: relay.test
      FRP_AUTH_PLUGIN_ADDR: auth-plugin:9000
    ports:
      - "8443:443"
    depends_on:
      - auth-plugin

  auth-plugin:
    build: ..
    environment:
      BURLA_BACKEND_URL: http://fake-backend:9100
    depends_on:
      - fake-backend

  fake-backend:
    image: python:3.13-slim
    volumes:
      - ./fake_backend.py:/fake_backend.py:ro
    command: ["python", "/fake_backend.py"]

  # Stands in for both a node and a deployed head behind TLS.
  node:
    image: caddy:2.10.2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro

  frpc-good:
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-good.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frps
      - node
    restart: on-failure

  frpc-bad:
    profiles: ["manual"]
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-bad.toml:/etc/frp/frpc.toml:ro

  frpc-squat:
    profiles: ["manual"]
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-squat.toml:/etc/frp/frpc.toml:ro

  frpc-unassigned:
    profiles: ["manual"]
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-unassigned.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frps
      - node

  frpc-conflict:
    profiles: ["manual"]
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-conflict.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frps
      - node

  frpc-mixed:
    profiles: ["manual"]
    image: fatedier/frpc:v0.70.1
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./frpc-mixed.toml:/etc/frp/frpc.toml:ro
