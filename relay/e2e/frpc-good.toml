# Mirrors the frpc config a real node writes in its startup script.
serverAddr = "frps"
serverPort = 7000
loginFailExit = false
user = "test-project"
metadatas.token = "good-token"
transport.poolCount = 4

[[proxies]]
name = "burla-node-1234abcd--test-project"
type = "https"
localIP = "node"
localPort = 8080
subdomain = "burla-node-1234abcd--test-project"

[[proxies]]
name = "head--test-project"
type = "https"
localIP = "node"
localPort = 5001
subdomain = "head--test-project"

[[proxies]]
name = "custom-dashboard--test-project"
type = "https"
localIP = "node"
localPort = 5001
customDomains = ["tract.burla.test"]
